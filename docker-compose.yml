services:
  db:
    image: postgres:16-alpine
    container_name: smart-parking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart_parking
      POSTGRES_PASSWORD: smart_parking
      POSTGRES_DB: smart_parking
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_parking -d smart_parking"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: smart-parking-api/Dockerfile
    container_name: smart-parking
    restart: unless-stopped
    env_file:
      - smart-parking-api/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://smart_parking:smart_parking@db:5432/smart_parking
      # The parking API (in this container) talks to the wallet backend (Laravel)
      # published on the Docker host at port 8001.
      WALLET_API_BASE_URL: http://host.docker.internal:8001
      # Public (browser-facing) URL of THIS API so the wallet hosted page can
      # redirect back to the parking callback after OTP/PIN is entered.
      WALLET_REDIRECT_BASE_URL: http://localhost:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

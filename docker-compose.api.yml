services:
  db:
    image: postgres:16-alpine
    container_name: smart-parking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart_parking
      POSTGRES_PASSWORD: smart_parking
      POSTGRES_DB: smart_parking
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_parking -d smart_parking"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./smart-parking-api
      dockerfile: Dockerfile
    container_name: smart-parking
    restart: unless-stopped
    env_file:
      - smart-parking-api/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://smart_parking:smart_parking@db:5432/smart_parking
      APP_ENV: development
      DEBUG: "True"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:3000"]'
      WALLET_API_BASE_URL: https://digital-wallet-backend-api.up.railway.app
      WALLET_REDIRECT_BASE_URL: http://localhost:8000
      CUSTOMER_APP_URL: http://localhost:5174
      MANAGEMENT_APP_URL: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
